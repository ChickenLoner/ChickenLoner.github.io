                        {/* ═══ INTRODUCTION ═══ */}
                        <Section id="introduction" title="Introduction" icon="BookOpen">
                            <p className="text-gray-700 leading-relaxed">
                                "When did this process stop running?" If you've done DFIR on Windows, you've asked this. The usual answers are <B>Security Event ID 4689</B> and <B>Sysmon Event ID 5</B>. But most systems don't have the right audit policy enabled, and Sysmon is rarely pre-deployed on compromised machines.
                            </p>
                            <p className="text-gray-700 leading-relaxed">
                                This post shows that the <B>Background Activity Moderator (BAM)</B>, a Windows kernel driver present since Windows 10 version 1709, records <B>process termination timestamps</B>. Not "last execution time" as most DFIR guides call it. BAM overwrites its FILETIME on process exit, so for any process that has terminated, the stored value is <B>when it ended</B>.
                            </p>
                            <Callout type="tip">
                                <p><B>Key finding:</B> BAM's kernel callback fires on both process creation and termination, overwriting the same FILETIME each time. The final stored value for a terminated process is the termination timestamp.</p>
                            </Callout>
                            <Callout type="info">
                                <p><B>Credit:</B> The kernel-level analysis in this post builds heavily on <a href="https://dfir.ru/2020/04/08/bam-internals/" target="_blank" rel="noopener noreferrer" style={{color:'var(--soc-cy)'}}>Maxim Suhanov's "BAM internals" research (2020)</a>, which first documented the internal workings of <C>bam.sys</C> through reverse engineering. Additional kernel extension mechanism insights from <a href="https://medium.com/yarden-shafir/yes-more-callbacks-the-kernel-extension-mechanism-c7300119a37a" target="_blank" rel="noopener noreferrer" style={{color:'var(--soc-cy)'}}>Yarden Shafir's research</a>, and practical testing methodology from <a href="https://github.com/Psmths/windows-forensic-artifacts/blob/main/execution/bam-dam.md" target="_blank" rel="noopener noreferrer" style={{color:'var(--soc-cy)'}}>Psmths' windows-forensic-artifacts</a>.</p>
                            </Callout>
                        </Section>

                        {/* ═══ THE PROBLEM ═══ */}
                        <Section id="problem" title="The Problem" icon="AlertTriangle">
                            <p className="text-gray-700 leading-relaxed">
                                Say a malicious installer ran on a compromised box. You need to know when it stopped running. What can you check?
                            </p>
                            <Table
                                headers={['Artifact', 'Records Termination?', 'Availability']}
                                rows={[
                                    ['<strong>Security Event ID 4689</strong>', 'Yes, exact time', 'Requires "Audit Process Termination" policy enabled, rarely configured by default'],
                                    ['<strong>Sysmon Event ID 5</strong>', 'Yes, exact time', 'Requires Sysmon deployment, not present on most systems'],
                                    ['<strong>Prefetch</strong>', 'No', 'Records last run time (process start), not termination'],
                                    ['<strong>SRUM AppTimeline</strong>', 'EndTime field, but rounded to the minute', 'Available on Windows 10+, but imprecise'],
                                    ['<strong>Amcache</strong>', 'No', 'Records execution metadata, not lifecycle events'],
                                    ['<strong>BAM</strong>', '<strong style="color:var(--soc-gn)">Yes, exact time</strong>', '<strong>Available by default on Windows 10 1709+</strong>'],
                                ]}
                            />
                            <p className="text-gray-700 leading-relaxed">
                                On most systems, 4689 is off and Sysmon was never installed. SRUM has an <C>EndTime</C> field, but it's <B>rounded to the nearest minute</B>. BAM fills the gap: <B>enabled by default</B>, and stores timestamps with <B>FILETIME precision</B> (100-nanosecond intervals).
                            </p>
                        </Section>

                        {/* ═══ WHAT MOST GUIDES SAY ═══ */}
                        <Section id="what-guides-say" title="What Most Guides Say (and Why It's Misleading)" icon="BookX">
                            <p className="text-gray-700 leading-relaxed">
                                Search for "BAM forensics" and every guide says the same thing: BAM records the <B>"last execution time"</B> of a program. Here's how popular resources describe it:
                            </p>
                            <ul className="list-disc list-outside ml-5 space-y-1 text-gray-700">
                                <li>"Provides full path of the executed program and last execution date/time"</li>
                                <li>"Last execution time of the program"</li>
                                <li>"64-bit Windows FILETIME timestamp showing when the program was last executed"</li>
                            </ul>
                            <p className="text-gray-700 leading-relaxed">
                                The phrase "last execution time" makes people think the timestamp is written when the program <B>starts</B>. If that were true, BAM timestamps should match Prefetch run times. They don't. The BAM timestamp consistently shows up <B>after</B> the Prefetch-recorded start time.
                            </p>
                            <Callout type="warning">
                                <p>Because of the "last execution time" label, most analysts treat BAM as redundant with Prefetch. It's not. <B>Prefetch = start time, BAM = termination time</B>. They cover different ends of the process lifecycle.</p>
                            </Callout>
                        </Section>

                        {/* ═══ KERNEL ANALYSIS ═══ */}
                        <Section id="kernel-analysis" title="Kernel-Level Analysis: Why BAM Records Termination" icon="Cpu">
                            <p className="text-gray-700 leading-relaxed">
                                The foundational reverse engineering of <C>bam.sys</C> was done by <B>Maxim Suhanov</B> in his 2020 blog post <a href="https://dfir.ru/2020/04/08/bam-internals/" target="_blank" rel="noopener noreferrer" style={{color:'var(--soc-cy)'}}>"BAM internals"</a>. His analysis revealed that unlike standard process monitoring drivers, BAM does <B>not</B> use <C>PsSetCreateProcessNotifyRoutine()</C>. Instead, it uses the undocumented <C>ExRegisterExtension()</C> API to register its callback via an <B>extension table</B>.
                            </p>

                            <SubSection title="The Callback Registration">
                                <p className="text-gray-700 leading-relaxed">
                                    The <C>bam.sys</C> driver stores its callback function <C>BampCreateProcessCallback</C> in a function table called <C>BampKernelCalloutTable</C>. This table is passed to <C>ExRegisterExtension()</C> with the magic constant <C>0x0E0005</C>, which is also found in the kernel's <C>PspInitializeBackgroundActivityModeratorCallouts</C> function.
                                </p>
                                <CodeBlock title="BAM callback registration flow">{`bam.sys DriverEntry
  └─► ExRegisterExtension()
        ├─ Magic: 0x0E0005
        ├─ Table: BampKernelCalloutTable
        └─ Callback: BampCreateProcessCallback
              ├─ Fires on process CREATION  → writes FILETIME
              └─ Fires on process TERMINATION → overwrites FILETIME`}</CodeBlock>
                            </SubSection>

                            <SubSection title="The Dual-Fire Behavior">
                                <p className="text-gray-700 leading-relaxed">
                                    The key part: <C>BampCreateProcessCallback</C> handles <B>both</B> process creation and termination. The name says "Create" but the kernel invokes it on exit too.
                                </p>
                                <p className="text-gray-700 leading-relaxed">
                                    Every time it fires, the callback writes a FILETIME to the registry value for that executable under:
                                </p>
                                <CodeBlock title="BAM registry path">{`HKLM\\SYSTEM\\CurrentControlSet\\Services\\bam\\State\\UserSettings\\<SID>\\
  └─ \\Device\\HarddiskVolume3\\path\\to\\executable.exe
       └─ Value: [FILETIME (8 bytes)] [flags (16 bytes)]`}</CodeBlock>
                                <p className="text-gray-700 leading-relaxed">
                                    Since it <B>overwrites</B> the same value each time, once a process exits, what's left in the registry is the <B>termination timestamp</B>.
                                </p>
                            </SubSection>

                            <SubSection title="Why the Name Is Misleading">
                                <p className="text-gray-700 leading-relaxed">
                                    The function is named <C>BampCreateProcessCallback</C> because it's registered through the process-creation callback infrastructure. But the kernel's extension mechanism routes <B>both</B> creation and termination events through the same function. The name is about how it's registered, not when it fires.
                                </p>
                            </SubSection>
                        </Section>

                        {/* ═══ TESTING & PROOF ═══ */}
                        <Section id="testing" title="Testing & Proof" icon="FlaskConical">
                            <p className="text-gray-700 leading-relaxed">
                                You can verify this yourself by watching the BAM registry value before and after running a process.
                            </p>

                            <SubSection title="Test Setup">
                                <Table
                                    headers={['Component', 'Details']}
                                    rows={[
                                        ['<strong>OS</strong>', 'Windows 10 Pro, Version 10.0.19041 Build 19041'],
                                        ['<strong>Tool</strong>', 'Registry Explorer / RECmd (Eric Zimmerman)'],
                                        ['<strong>Test binary</strong>', 'Any GUI application (e.g., notepad.exe, calc.exe)'],
                                        ['<strong>Observation</strong>', 'Monitor BAM registry key in real-time or via before/after hive snapshots'],
                                    ]}
                                />
                            </SubSection>

                            <SubSection title="Test Procedure">
                                <p className="text-gray-700 leading-relaxed">
                                    <B>Step 1:</B> Open Registry Explorer and navigate to:<br/>
                                    <C>HKLM\SYSTEM\CurrentControlSet\Services\bam\State\UserSettings\&lt;Your SID&gt;</C>
                                </p>
                                <p className="text-gray-700 leading-relaxed">
                                    <B>Step 2:</B> Launch a test application (e.g., <C>notepad.exe</C>). Note the time you launched it.
                                </p>
                                <p className="text-gray-700 leading-relaxed">
                                    <B>Step 3:</B> Refresh the registry view. A new BAM entry appears for <C>notepad.exe</C>. The FILETIME timestamp corresponds to the <B>process creation time</B>.
                                </p>
                                <p className="text-gray-700 leading-relaxed">
                                    <B>Step 4:</B> Wait a noticeable amount of time (e.g., 2-3 minutes), then <B>close</B> the application.
                                </p>
                                <p className="text-gray-700 leading-relaxed">
                                    <B>Step 5:</B> Refresh the registry view. The <B>first 8 bytes of the BAM value have changed</B>. The new FILETIME corresponds to the <B>process termination time</B>, not the original creation time.
                                </p>
                                <Callout type="info">
                                    <p>If BAM only recorded "execution time" (start), the value wouldn't change after you close the application. It does change. That's the proof.</p>
                                </Callout>
                            </SubSection>

                            <SubSection title="What You Should See">
                                <p className="text-gray-700 leading-relaxed">
                                    After Step 3, decode the first 8 bytes of the BAM value as a FILETIME. It should match (within a second) the time you launched the app. After Step 5, decode again. The FILETIME now matches when you <B>closed</B> the app, not when you opened it. The difference between the two timestamps equals roughly how long you kept the application running.
                                </p>
                                <p className="text-gray-700 leading-relaxed">
                                    Try it yourself. The result is unambiguous.
                                </p>
                            </SubSection>
                        </Section>

                        {/* ═══ REAL WORLD CASE ═══ */}
                        <Section id="real-world-case" title="Real-World Application: When SRUM Fails, BAM Delivers" icon="Search">
                            <p className="text-gray-700 leading-relaxed">
                                During an investigation, we needed to find when a suspicious executable stopped running on a compromised Windows box. Here's what each artifact gave us:
                            </p>

                            <SubSection title="Artifact Comparison">
                                <Table
                                    headers={['Artifact', 'Result', 'Useful?']}
                                    rows={[
                                        ['<strong>Prefetch (PECmd)</strong>', 'Two run times found', 'Start times only, not termination'],
                                        ['<strong>Security Event ID 4689</strong>', 'Not available', 'Audit policy not configured'],
                                        ['<strong>Sysmon Event ID 5</strong>', 'Not available', 'Sysmon not deployed'],
                                        ['<strong>SRUM AppTimeline EndTime</strong>', 'Rounded to nearest minute', '<span style="color:var(--soc-rd)">Imprecise - could not pinpoint exact second</span>'],
                                        ['<strong>Amcache</strong>', 'No termination data', 'Execution metadata only'],
                                        ['<strong>ActivitiesCache</strong>', 'EndTime = 0', 'Not recorded'],
                                        ['<strong>BAM</strong>', '<strong style="color:var(--soc-gn)">Exact timestamp with FILETIME precision</strong>', '<strong style="color:var(--soc-gn)">Confirmed as process termination time</strong>'],
                                    ]}
                                />
                            </SubSection>

                            <SubSection title="The Investigation Flow">
                                <p className="text-gray-700 leading-relaxed">
                                    Started with <B>Prefetch</B> (PECmd). Got execution times, but those are <B>start times</B> only.
                                </p>
                                <p className="text-gray-700 leading-relaxed">
                                    Checked <B>Security Event Log</B> for 4689 (Process Termination). Zero hits. Audit policy was never turned on.
                                </p>
                                <p className="text-gray-700 leading-relaxed">
                                    Parsed <B>SRUM</B> with SrumECmd. The AppTimeline <C>EndTime</C> values looked promising, but digging into the raw ESE database showed they're <B>rounded to the nearest minute</B> by design. Not good enough when you need the exact second.
                                </p>
                                <p className="text-gray-700 leading-relaxed">
                                    Finally, pulled <B>BAM</B> from the SYSTEM hive with RECmd. The FILETIME for the executable came in <B>after</B> both Prefetch start times and all child process activity visible in UsnJrnl. That's termination, not start.
                                </p>
                                <CodeBlock title="RECmd command to extract BAM entries">{`RECmd.exe -f "path\\to\\SYSTEM" --kn "ControlSet001\\Services\\bam\\State\\UserSettings" --nl`}</CodeBlock>
                                <CodeBlock title="Example: Decoding a BAM registry value">{`Value Name: \\Device\\HarddiskVolume3\\path\\to\\suspicious.exe
Value Data: DA-85-D7-74-DB-E2-DB-01-00-00-00-00-00-00-00-00-00-00-00-00-02-00-00-00

First 8 bytes (FILETIME): DA-85-D7-74-DB-E2-DB-01
Decoded: 2025-06-21 18:36:52 UTC  ← Process termination time`}</CodeBlock>
                            </SubSection>

                            <SubSection title="Cross-Validation with UsnJrnl">
                                <p className="text-gray-700 leading-relaxed">
                                    UsnJrnl ($J) gave some supporting context, but with a caveat: <B>UsnJrnl doesn't record which process caused a file change</B>. It only logs the file operation itself (create, modify, delete) and the timestamp. So you can't directly say "this entry was from our target process."
                                </p>
                                <p className="text-gray-700 leading-relaxed">
                                    What you <B>can</B> do is look at the pattern. In this case, the last file activity we could tie to the malware's execution chain stopped about 30 seconds before the BAM timestamp. No more related activity after that. It's circumstantial, not definitive, but it's consistent with BAM recording termination rather than start.
                                </p>
                            </SubSection>
                        </Section>

                        {/* ═══ PRACTICAL GUIDE ═══ */}
                        <Section id="practical-guide" title="Practical Guide for DFIR" icon="Shield">
                            <SubSection title="When to Use BAM for Termination Time">
                                <p className="text-gray-700 leading-relaxed">
                                    Check BAM for process termination time when:
                                </p>
                                <ul className="list-disc list-outside ml-5 space-y-1 text-gray-700">
                                    <li>Security Event ID 4689 is unavailable (audit policy not configured)</li>
                                    <li>Sysmon Event ID 5 is unavailable (Sysmon not deployed)</li>
                                    <li>SRUM EndTime precision (rounded to minute) is insufficient</li>
                                    <li>The system is Windows 10 version 1709 or later</li>
                                </ul>
                            </SubSection>

                            <SubSection title="Where to Find BAM Data">
                                <CodeBlock title="BAM registry location">{`Live system:
  HKLM\\SYSTEM\\CurrentControlSet\\Services\\bam\\State\\UserSettings\\<SID>

Offline analysis:
  SYSTEM hive → ControlSet001\\Services\\bam\\State\\UserSettings\\<SID>

DAM (Desktop Activity Moderator) - same structure:
  SYSTEM hive → ControlSet001\\Services\\dam\\State\\UserSettings\\<SID>`}</CodeBlock>
                            </SubSection>

                            <SubSection title="How to Parse BAM Timestamps">
                                <p className="text-gray-700 leading-relaxed">
                                    Each BAM entry is a registry value where the value name is the full device path of the executable and the value data is a 24-byte binary structure:
                                </p>
                                <CodeBlock title="BAM value data structure">{`Offset  Size   Field
0x00    8      FILETIME - process termination timestamp (for exited processes)
0x08    8      Reserved (typically zeros)
0x10    4      Reserved
0x14    4      Flags (typically 0x00000002)`}</CodeBlock>
                                <p className="text-gray-700 leading-relaxed">
                                    <B>Tools for parsing:</B>
                                </p>
                                <Table
                                    headers={['Tool', 'Command']}
                                    rows={[
                                        ['<strong>RECmd</strong>', '<code>RECmd.exe -f SYSTEM --kn "ControlSet001\\Services\\bam\\State\\UserSettings" --nl</code>'],
                                        ['<strong>Registry Explorer</strong>', 'Navigate to the key, decode FILETIME from the first 8 bytes of each value'],
                                        ['<strong>Python</strong>', '<code>datetime.datetime(1601,1,1) + datetime.timedelta(microseconds=filetime//10)</code>'],
                                        ['<strong>dcode.fr</strong>', 'dcode.fr/timestamp-converter - paste the decimal FILETIME value, select Windows FILETIME format'],
                                    ]}
                                />
                            </SubSection>

                            <SubSection title="How BAM Complements Other Artifacts">
                                <Table
                                    headers={['Question', 'Best Artifact']}
                                    rows={[
                                        ['When did the process <strong>start</strong>?', '<strong>Prefetch</strong> (last run times from PECmd)'],
                                        ['When did the process <strong>terminate</strong>?', '<strong>BAM</strong> (FILETIME from registry)'],
                                        ['How long did the process <strong>run</strong>?', '<strong>BAM timestamp − Prefetch last run time</strong>'],
                                        ['What files did the process <strong>access</strong>?', '<strong>Prefetch</strong> (file references list)'],
                                        ['How much <strong>resource</strong> did the process use?', '<strong>SRUM</strong> (AppResourceUseInfo)'],
                                    ]}
                                />
                            </SubSection>
                        </Section>

                        {/* ═══ LIMITATIONS ═══ */}
                        <Section id="limitations" title="Limitations & Caveats" icon="TriangleAlert">
                            <Callout type="warning">
                                <p>BAM has real limitations. Know them before you rely on it.</p>
                            </Callout>
                            <Table
                                headers={['Limitation', 'Impact']}
                                rows={[
                                    ['<strong>7-day expiry</strong>', 'BAM entries older than 7 days are deleted on system reboot. If the system rebooted after the incident, entries may be gone.'],
                                    ['<strong>Console applications</strong>', 'Programs launched via command-line interface may not generate BAM entries.'],
                                    ['<strong>Still-running processes</strong>', 'If the process was still running when the image was captured, the BAM timestamp reflects process creation time (the termination overwrite hasn\'t occurred yet).'],
                                    ['<strong>Deleted executables</strong>', 'If the executable is deleted from disk, the BAM entry is removed on the next reboot.'],
                                    ['<strong>Removable media / network shares</strong>', 'Executables on removable media or network shares may not generate BAM entries.'],
                                    ['<strong>Windows version</strong>', 'BAM was introduced in Windows 10 version 1709 (Fall Creators Update). Not available on older systems.'],
                                ]}
                            />
                        </Section>

                        {/* ═══ CONCLUSION ═══ */}
                        <Section id="conclusion" title="Conclusion" icon="CheckCircle">
                            <p className="text-gray-700 leading-relaxed">
                                Every DFIR guide calls BAM's timestamp "last execution time." That label is wrong, or at best, incomplete. Here's what we know from the kernel analysis and testing:
                            </p>
                            <ul className="list-disc list-outside ml-5 space-y-1 text-gray-700">
                                <li><C>BampCreateProcessCallback</C> fires on <B>both</B> process creation and termination</li>
                                <li>The FILETIME is <B>overwritten</B> on each event, so the final value reflects the <B>last event</B></li>
                                <li>For terminated processes, this means the stored timestamp is the <B>termination time</B></li>
                                <li>BAM is available <B>by default</B> on Windows 10 1709+, unlike Event ID 4689 or Sysmon</li>
                            </ul>
                            <p className="text-gray-700 leading-relaxed">
                                If your system doesn't have 4689 or Sysmon (most don't), BAM is probably your best bet for process termination time. Stop treating it as a duplicate of Prefetch. <B>Prefetch tells you when it started. BAM tells you when it ended.</B>
                            </p>
                        </Section>
